<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tipos de listas</title>
</head>
<body>
<h1>Listas HTML</h1>
<h2>Listas ordenadas</h2>
<ol start="3" type="A">
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>
<ol start="4" type="i">
    <li>Primero</li>
    <li>Segundo</li>
    <li>Tercero</li>
</ol>
<h2>Listas desordenadas</h2>
<ul type="disc">
    <li>Pan</li>
    <li>Leche</li>
</ul>
<ul type="circle">
    <li>Manzana</li>
    <li>Pera</li>
</ul>
<ul type="square">
    <li>Agua</li>
    <li>Zumo</li>
</ul>
<h2>Menú web</h2>
<ul>
    <li>Inicio</li>
    <li>Estudios
        <ul>
            <li>DAW
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                </ul>
            </li>
            <li>ASIR</li>
        </ul>
    </li>
    <li>Contacto</li>
</ul>
</body>
</html>
